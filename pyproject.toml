[project]
name = "subnet-trainer"
version = "0.1.0"
description = "Subnetting-Trainer fürs Terminal (CCNA-Vorbereitung)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "rich>=13.7",
    "typer>=0.12",
]

[project.scripts]
subnet-trainer = "subnet_trainer.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/subnet_trainer"]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = [
    "RUF001",  # German text legitimately contains en dashes etc.
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["subnet_trainer"]
known-local-folder = ["conftest", "helpers"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]
